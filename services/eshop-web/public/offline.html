<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c8102e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ออฟไลน์ – eShop</title>
    <!-- Shown by the service worker (#59) when a page can't load without a connection. Its styles are inline
         because nothing else may be reachable; the favicon is pre-cached with it. -->
    <style>
      :root {
        --brand: #c8102e;
        --brand-dark: #9e0c24;
        --ink: #1d1d1f;
        --muted: #5f6368;
        color: var(--ink);
        background: #f5f5f7;
        font-family: 'Noto Sans Thai', 'Sukhumvit Set', 'Thonburi', system-ui, -apple-system, sans-serif;
        line-height: 1.6;
        -webkit-text-size-adjust: 100%;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      header {
        background: var(--brand);
        padding: calc(0.75rem + env(safe-area-inset-top)) 1rem 0.75rem;
      }
      .brand-logo {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        padding: 0.25rem 0.7rem;
        border-radius: 10px;
        background: #fff;
        color: var(--brand);
        line-height: 1.1;
      }
      .brand-logo strong {
        font-size: 1.15rem;
        font-weight: 800;
      }
      .brand-logo small {
        font-size: 0.75rem;
        font-weight: 600;
      }
      main {
        flex: 1;
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        padding: 2.5rem 1rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.3;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      button {
        min-height: 44px;
        padding: 0.6rem 1.5rem;
        border: 0;
        border-radius: 999px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--brand-dark);
      }
      button:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand-logo" aria-label="eShop อีช้อป"><strong>eShop</strong><small>อีช้อป</small></span>
    </header>
    <main>
      <h1>คุณออฟไลน์อยู่</h1>
      <p>ไม่มีการเชื่อมต่ออินเทอร์เน็ต กรุณาตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง</p>
      <button type="button" onclick="location.reload()">ลองอีกครั้ง</button>
    </main>
  </body>
</html>
