# The performance gate's load and thresholds, in one place (scripts/gates/perf.sh, locustfile.py beside this file).
# Any value can also be given for one run as LOCUST_<NAME> (e.g. LOCUST_RUN_TIME=20s), which overrides this file.

# Load: about 50 Customers for a minute, started 10 per second.
users = 50
spawn-rate = 10
run-time = 60s

# Thresholds: the gate fails when the p95 of all eShop requests is over p95-ms, or when more than
# max-error-ratio of them failed (0.01 = 1%).
p95-ms = 500
max-error-ratio = 0.01

# How it runs (perf.sh mounts this folder at /mnt/locust and the report folder at /reports).
locustfile = /mnt/locust/locustfile.py
headless = true
only-summary = true
stop-timeout = 10
csv = /reports/locust
html = /reports/locust.html
summary-file = /reports/summary.txt
