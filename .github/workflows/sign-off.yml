# Sign off a release candidate (docs/git-workflow.md, "Sign-off"; ADR 0008): runs when a push to main adds or changes a
# release's record releases/X.Y.Z.md, i.e. when the QA lead merges the sign-off PR "Sign off vX.Y.Z-rc.N" that e2e.yml
# opened after QA's smoke test of the candidate passed (scripts/sign-off-pr.sh). Merging it is the sign-off; there is
# no other way to start this.
#
# The decisions and steps are all in scripts/sign-off.sh (tested by scripts/tests/release-scripts.sh); this file only
# supplies tokens and tools. It refuses, changing nothing and failing this run, unless main still pins eshop-qa to
# the record's candidate (not suspended), QA's latest Deployment of it created since main last changed QA's pin
# succeeded, and the version isn't released yet. That Deployment's run asked the cluster that QA served the candidate
# before and after the test; this hosted runner can't reach the cluster, so the Deployment stands in for it.
# Then: copies the candidate's images to X.Y.Z by digest (never rebuilt), tags vX.Y.Z on the candidate's commit (the
# tag message names who merged the PR), publishes the GitHub Release and opens the prod promotion PR. Re-running the
# failed job finishes it.
#
# Pushing vX.Y.Z runs ci-release.yml, whose `plan` skips a plain release tag (scripts/check-release-tag.sh): nothing
# is built. Writes use the secret PROMOTION_TOKEN (docs/setup.md, "Promotion token") so the tag and the PR trigger
# their workflows (a PR opened with GITHUB_TOKEN would get no checks); the workflow's own token only reads.
# PROMOTION_TOKEN and DOCKERHUB_TOKEN are secrets of environment `release`, which deploys only from main and v* tags
# (scripts/protect-main.sh). The job's `environment:` key also records a GitHub Deployment to `release` of main: the
# key always does, and nothing reads those (the smoke tests' Deployments are to dev, qa and prod).
name: Sign off release candidate
run-name: Sign off at ${{ github.sha }}

on:
  push:
    branches: [main]
    paths: ["releases/*.md"]

permissions: {}

concurrency:
  group: sign-off # one sign-off at a time; never cancel one half-way
  cancel-in-progress: false

jobs:
  sign-off:
    name: sign off
    runs-on: ubuntu-latest
    environment: release # its secrets; deployable from main (and v* tags) only
    permissions:
      contents: read
      deployments: read # QA's Deployments of the candidate
      pull-requests: read # the merged PR: who signed off
    steps:
      - name: Check PROMOTION_TOKEN
        env:
          PROMOTION_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
        run: |
          if [ -z "$PROMOTION_TOKEN" ]; then
            echo "::error::Secret PROMOTION_TOKEN (environment release) is missing, so sign-off can't push the release tag or open" \
              "the prod promotion PR. Create it as described in docs/setup.md, \"Promotion token\", then re-run this job."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # main's history: the push's commits, and when QA's pin last changed
          token: ${{ secrets.PROMOTION_TOKEN }} # git push of the release tag and the promotion branch
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.1
      # crane reads the Docker credentials this writes. Needs the repo variable DOCKERHUB_USERNAME and the secret
      # DOCKERHUB_TOKEN (Read & Write), as CI's push job does.
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Sign off
        shell: bash # -eo pipefail: a refusal fails the step despite the tee
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
          IMAGE_REGISTRY: docker.io/${{ vars.DOCKERHUB_USERNAME }}
          SIGN_OFF_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SIGN_OFF_READ_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.PROMOTION_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status=0
          scripts/sign-off.sh "$BEFORE" "$AFTER" 2>&1 | tee "$RUNNER_TEMP/sign-off.log" || status=$?
          { echo "### Sign-off"; echo; echo '```'; cat "$RUNNER_TEMP/sign-off.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::$(grep -m 1 'Sign-off refused' "$RUNNER_TEMP/sign-off.log" || tail -n 1 "$RUNNER_TEMP/sign-off.log")"
            exit "$status"
          fi
