# CI and tag-based releases. See docs/git-workflow.md.
#   - push / PR to main or release/*  -> lint + test every service
#   - push to main                    -> also build changed services for arm64, Trivy scan,
#                                        push ghcr.io/pkhamdee/<service>:main-<sha>[-<unix-ts>]
#                                        (Flux image automation deploys the newest to sphone-dev)
#   - push tag vX.Y.Z                 -> lint + test, validate the tag, build EVERY service, scan,
#                                        push ghcr.io/pkhamdee/<service>:X.Y.Z, then publish the GitHub Release
#                                        (Flux then runs tag vX.Y.Z with the X.Y.Z images in sphone-prod)
#   - workflow_dispatch               -> no input, on main: rebuild and push every service as main-<sha>
#                                        input version=0.0.0-test.N: dry run of the release build on any
#                                        branch; pushes every service as that pre-release tag, no GitHub Release
#                                        (never deployed: sphone-prod follows plain X.Y.Z releases only)
#
# Adding a service: add a lint/test job below and to `plan.needs`, and an entry in
# .github/services.json (build context, Dockerfile, source paths). Release builds pick it up automatically.
name: CI / Release

on:
  push:
    branches: [main, "release/*"]
    tags: ["v*"]
    # Flux's image-automation commits touch only these (deploy/apps/dev, deploy/thirdparty, clusters/local);
    # nothing here is linted, tested or built, so such pushes run no CI. GitHub ignores path filters on tag
    # pushes, so a release tag always builds even when it points at a Flux commit. (Flux commits must not say
    # "[skip ci]": that also skips a tag pushed onto them.)
    paths-ignore: ["deploy/**", "clusters/**"]
  pull_request:
    branches: [main, "release/*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release dry run: build and push every service as this pre-release tag (0.0.0-test.N). Empty = rebuild main-<sha> (main only)."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sphone-api:
    name: sphone-api (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sphone-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: services/sphone-api/global.json
      - run: dotnet restore
      - name: Lint
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build --no-restore -c Release
      # Seam-1 tests (sphone-api) start PostgreSQL with Testcontainers (Docker is available on GitHub runners).
      # Seam-2 tests (sphone-sync-master, same solution) also start SQL Server, which has no Arm image: this job
      # must stay on an x86 runner (ubuntu-latest).
      - name: Test
        run: dotnet test --no-build -c Release

  sphone-web:
    name: sphone-web (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sphone-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/sphone-web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build

  # Test equipment (no tests of its own, per the spec): lint and type-check only.
  thirdparty-mock:
    name: thirdparty-mock (lint, type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/thirdparty-mock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/thirdparty-mock/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck


  sphone-node-api:
    name: sphone-node-api (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sphone-node-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/sphone-node-api/package-lock.json
      - run: npm ci
      - name: Lint and type-check
        run: npm run lint
      # Seam-3 tests: real HTTP against a temporary folder standing in for the SMB share.
      - name: Test
        run: npm test

  # Mechanical rules no service job covers. Not in plan.needs: a release tag never waits on it.
  repo-rules:
    name: repo rules (skip-ci markers, shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A Flux commit message with a skip-ci marker makes GitHub skip every push workflow on that commit,
      # including a release tag pushed onto it (that is how v0.1.0 never built). docs/git-workflow.md.
      - name: No skip-ci markers in Flux commit templates
        run: |
          if grep -rniE '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]' deploy clusters; then
            echo "::error::Remove the skip-ci marker above; CI already ignores deploy/** and clusters/** pushes"
            exit 1
          fi
      - name: ShellCheck
        run: shellcheck scripts/*.sh e2e/*.sh

  # Decides what to build, after every service's lint/test passed:
  #   - tag vX.Y.Z: validate the tag (semver, annotated, on a release/N.x branch); build every service as X.Y.Z.
  #   - workflow_dispatch with `version`: release dry run; build every service as that pre-release tag.
  #   - main: build services whose `paths` changed since the previous push, tagged main-<sha>. Everything is
  #     rebuilt when the push has no usable base (first push, force push), when this workflow or services.json
  #     changes, or on workflow_dispatch without `version`.
  plan:
    needs: [sphone-api, sphone-web, thirdparty-mock, sphone-node-api]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      version: ${{ steps.select.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          all=$(jq -c . .github/services.json)
          version=""
          if [ "$REF_TYPE" = "tag" ]; then
            # Enforce the workflow rules: semver name, annotated tag, tagged commit on a release/N.x branch.
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1
            fi
            if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
              echo "::error::Tag '$TAG' is lightweight; release tags must be annotated (git tag -a)"; exit 1
            fi
            if ! git branch -r --contains "$TAG" | grep -qE '^\s*origin/release/[0-9]+\.x$'; then
              echo "::error::Tag '$TAG' is not on any release/N.x branch"; exit 1
            fi
            version="${TAG#v}"
            matrix="$all"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "$DRY_RUN_VERSION" ]; then
            # Only 0.0.0-test.N: never deployed (sphone-prod follows plain X.Y.Z releases only), so a dry run is harmless.
            if ! [[ "$DRY_RUN_VERSION" =~ ^0\.0\.0-test\.[0-9]+$ ]]; then
              echo "::error::Dry-run version must be 0.0.0-test.N"; exit 1
            fi
            version="$DRY_RUN_VERSION"
            matrix="$all"
          elif [ "$REF" != "refs/heads/main" ]; then
            echo "::notice::main-<sha> images are only built from main"
            matrix="[]"
          elif [ "$EVENT" != "push" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            matrix="$all"
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            echo "Changed files:"; echo "$changed"
            if grep -qxE '\.github/workflows/ci-release\.yml|\.github/services\.json' <<<"$changed"; then
              matrix="$all"
            else
              matrix=$(jq -c --arg changed "$changed" '
                ($changed | split("\n")) as $files
                | [ .[] | select(.paths as $p | any($files[]; . as $f | any($p[]; . as $prefix | $f | startswith($prefix)))) ]
              ' .github/services.json)
            fi
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: ${version:-main-<sha>}; services to build: $(jq -r 'map(.service) | join(", ")' <<<"$matrix")"

  images:
    name: image ${{ matrix.service }}
    needs: [plan]
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04-arm # native arm64 build for the Apple Silicon cluster
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: tags
        run: |
          if [ -n "$VERSION" ]; then
            # Release (X.Y.Z; Flux moves sphone-prod to the newest) or dry run (0.0.0-test.N; never deployed).
            echo "list=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
            echo "scan=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            sha=$(git rev-parse --short=7 HEAD)
            ts=$(git show -s --format=%ct HEAD)
            # main-<sha> for humans; main-<sha>-<commit-ts> is what Flux's sphone-dev ImagePolicy orders by.
            echo "list=${IMAGE}:main-${sha},${IMAGE}:main-${sha}-${ts}" >> "$GITHUB_OUTPUT"
            echo "scan=${IMAGE}:main-${sha}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          load: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan (fail on critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.scan }}
          severity: CRITICAL
          exit-code: "1"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          for tag in ${TAGS//,/ }; do docker push "$tag"; done

  # Publishes the GitHub Release only after every service's X.Y.Z image was built, scanned and pushed.
  release:
    if: github.ref_type == 'tag'
    needs: [plan, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
          SERVICES: ${{ needs.plan.outputs.matrix }}
        run: |
          images=$(jq -r --arg owner "${GITHUB_REPOSITORY_OWNER}" --arg v "$VERSION" \
            '.[] | "- `ghcr.io/\($owner)/\(.service):\($v)`"' <<<"$SERVICES")
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG" \
            --notes "$(printf 'Images (deployed to sphone-prod by Flux):\n%s\n' "$images")"
