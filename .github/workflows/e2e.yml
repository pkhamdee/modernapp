# Seam 4: the definition-of-done demo as one Playwright browser test against a DEPLOYED environment.
# Run by hand (Actions -> E2E smoke test -> Run workflow), never on push or PR:
#   - QA's test of a release candidate: environment `qa`, version `X.Y.Z-rc.N` (required). Sign-off
#     (docs/git-workflow.md, "QA test run") looks for a passing run of exactly that candidate by its run name.
#   - the post-release smoke test on prod: environment `prod`, version `X.Y.Z` optional;
#   - dev (follows main, no version).
#
# Given a version, the job refuses unless the environment is actually serving it, asked of the cluster rather than
# Git (e2e/check-serving.sh: Flux applied tag vX and every Deployment runs the X images), and checks again after
# the test, so a passing run tested that version from start to end.
#
# The run name records what was tested, `E2E <environment>[ <version>]`, e.g. `E2E qa 0.3.0-rc.1`. The latest
# passing QA run for a version (sign-off's query):
#   gh run list --repo pkhamdee/modernapp --workflow e2e.yml --branch main --event workflow_dispatch \
#     --status completed --limit 100 --json databaseId,displayTitle,conclusion,url \
#     --jq '[.[] | select(.displayTitle == "E2E qa 0.3.0-rc.1")] | first'
# and its conclusion must be "success". `--branch main` matters: a run dispatched from another branch runs that
# branch's copy of this workflow, which may skip the check.
#
# The environments live on a local cluster (https://eshop.localhost, https://qa.eshop.localhost,
# https://prod.eshop.localhost), which GitHub-hosted runners cannot reach. The job runs on an on-demand runner on
# the machine that hosts the cluster: `e2e/run-on-actions.sh [environment] [version]` registers an ephemeral
# runner labelled `eshop-e2e`, dispatches this workflow to it and unregisters it afterwards (the repository is
# public, so no runner stays registered). Dispatching from the Actions tab only works while such a runner is
# online. Or simply run `npm run e2e` there (docs/setup.md "End-to-end smoke test"); only a run here counts for
# sign-off.
#
# Staff account: the test decrypts deploy/apps/<env>/eshop-api-staff.sops.yaml with sops and the age key on
# the runner. Optional secrets E2E_STAFF_USERNAME / E2E_STAFF_PASSWORD take precedence; none are needed.
name: E2E smoke test
run-name: E2E ${{ inputs.environment }}${{ inputs.version != '' && format(' {0}', inputs.version) || '' }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to test: prod (https://prod.eshop.localhost), qa (https://qa.eshop.localhost) or dev (https://eshop.localhost)"
        type: choice
        options: [prod, qa, dev]
        default: prod
      version:
        description: "The version the environment must be serving: qa X.Y.Z-rc.N (required), prod X.Y.Z (optional), dev none"
        required: false
        default: ""
      runner:
        description: "Runner label that can reach the cluster"
        required: true
        default: "eshop-e2e"

permissions:
  contents: read

concurrency:
  group: e2e-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright demo (${{ inputs.environment }}${{ inputs.version != '' && format(' {0}', inputs.version) || '' }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    env:
      E2E_ENV: ${{ inputs.environment }}
      E2E_BASE_URL: ${{ inputs.environment == 'dev' && 'https://eshop.localhost' || format('https://{0}.eshop.localhost', inputs.environment) }}
      VERSION: ${{ inputs.version }}
      STAFF_USERNAME: ${{ secrets.E2E_STAFF_USERNAME }}
      STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Record what this run tests
        run: |
          tested="none given, not checked"
          [ -z "$VERSION" ] || tested="\`$VERSION\`"
          {
            echo "## E2E smoke test: $E2E_ENV${VERSION:+ $VERSION}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`$E2E_ENV\` ($E2E_BASE_URL) |"
            echo "| Version | $tested |"
            echo "| Test code | \`$GITHUB_SHA\` ($GITHUB_REF_NAME) |"
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$E2E_ENV" = qa ] && [ -z "$VERSION" ]; then
            echo "::error::A QA run needs the release candidate QA is serving: version X.Y.Z-rc.N"
            exit 1
          fi
      # Refuse unless the cluster serves exactly this version (stderr says why not).
      - name: Check ${{ inputs.environment }} is serving ${{ inputs.version }}
        if: ${{ inputs.version != '' }}
        run: |
          if ! ./check-serving.sh "$E2E_ENV" "$VERSION" >serving.txt 2>&1; then
            cat serving.txt
            echo "::error::$(tail -n 1 serving.txt)"
            { echo; echo "**Refused**: $(tail -n 1 serving.txt)"; } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat serving.txt
          { echo; echo "Serving before the test:"; echo '```'; cat serving.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      # No `cache: npm`: on this machine's runner it would upload the user's whole ~/.npm to the repository's
      # Actions cache (readable by pull-request workflows); npm already reuses ~/.npm locally.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: Run the demo
        run: npm run e2e
      # The environment must not have moved during the test (a promotion merged meanwhile): otherwise the pass
      # proves nothing about this version.
      - name: Check ${{ inputs.environment }} still serves ${{ inputs.version }}
        if: ${{ inputs.version != '' }}
        run: |
          if ! ./check-serving.sh "$E2E_ENV" "$VERSION" >serving-after.txt 2>&1; then
            cat serving-after.txt
            echo "::error::Changed during the test: $(tail -n 1 serving-after.txt)"
            { echo; echo "**Changed during the test**: $(tail -n 1 serving-after.txt)"; } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! diff -q serving.txt serving-after.txt >/dev/null; then
            diff serving.txt serving-after.txt || true
            echo "::error::$E2E_ENV was redeployed during the test"
            { echo; echo "**Redeployed during the test**"; } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          { echo; echo "Still serving $VERSION after the test."; } >>"$GITHUB_STEP_SUMMARY"
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # The report carries no traces in CI (see playwright.config.ts) and never the Staff password.
          path: e2e/playwright-report
          retention-days: 14
