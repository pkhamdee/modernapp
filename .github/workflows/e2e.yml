# Seam 4: the definition-of-done demo as one Playwright browser test against a DEPLOYED environment.
# A post-release smoke test, run by hand (Actions -> E2E smoke test -> Run workflow): never on push or PR.
#
# The environments live on a local cluster (https://sphone.localhost, https://prod.sphone.localhost), which
# GitHub-hosted runners cannot reach. The job runs on an on-demand runner on the machine that hosts the cluster:
# `e2e/run-on-actions.sh [base_url]` registers an ephemeral runner labelled `sphone-e2e`, dispatches this
# workflow to it and unregisters it afterwards (the repository is public, so no runner stays registered).
# Dispatching from the Actions tab only works while such a runner is online. Or simply run `npm run e2e` there
# (docs/setup.md "End-to-end smoke test").
#
# Staff account: the test decrypts deploy/apps/<env>/sphone-api-staff.sops.yaml with sops and the age key on
# the runner. Optional secrets E2E_STAFF_USERNAME / E2E_STAFF_PASSWORD take precedence; none are needed.
name: E2E smoke test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Environment to test: https://prod.sphone.localhost (sphone-prod) or https://sphone.localhost (sphone-dev)"
        required: true
        default: "https://prod.sphone.localhost"
      runner:
        description: "Runner label that can reach the cluster"
        required: true
        default: "sphone-e2e"

permissions:
  contents: read

concurrency:
  group: e2e-${{ inputs.base_url }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright demo (${{ inputs.base_url }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    env:
      E2E_BASE_URL: ${{ inputs.base_url }}
      STAFF_USERNAME: ${{ secrets.E2E_STAFF_USERNAME }}
      STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      # No `cache: npm`: on this machine's runner it would upload the user's whole ~/.npm to the repository's
      # Actions cache (readable by pull-request workflows); npm already reuses ~/.npm locally.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: Run the demo
        run: npm run e2e
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # The report carries no traces in CI (see playwright.config.ts) and never the Staff password.
          path: e2e/playwright-report
          retention-days: 14
