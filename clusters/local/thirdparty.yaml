# Shared mocked third parties in the `thirdparty` namespace, used by eshop-dev, eshop-qa and eshop-prod:
# thirdparty-mock (SMS, later ID Verification and Credit Check), Samba (image share), SQL Server
# (Enterprise System). One folder per component under deploy/thirdparty/.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: thirdparty
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  retryInterval: 1m
  timeout: 10m # first SQL Server start under Rosetta (image pull + system databases) is slow
  path: ./deploy/thirdparty
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
