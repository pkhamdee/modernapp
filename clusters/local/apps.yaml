# eshop-dev follows main (newest main-<sha> images, manifests from main).
# eshop-prod follows release tags: manifests AND images come from the newest vX.Y.Z release (see prod-release.yaml
# and docs/git-workflow.md). The release's own manifests name its namespace: releases up to v0.1.x still deploy
# to sphone-prod at prod.sphone.localhost, which main keeps serving until prod runs v0.2.0 (docs/setup.md,
# "Moving to eShop").
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-dev
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./deploy/apps/dev
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-prod
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./deploy/apps/prod
  prune: true
  wait: true
  # deploy/apps/prod as it is in the release tag (GitRepository eshop-release, prod-release.yaml).
  sourceRef:
    kind: GitRepository
    name: eshop-release
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # The release's images, X.Y.Z for vX.Y.Z. Written by Flux image automation (prod-release.yaml) in the same commit
  # that moves eshop-release to that tag; do not edit by hand. 0.0.0 = no release yet.
  # Releases up to v0.1.x run the old sphone-* image names (#49 renamed them): keep those entries until prod runs
  # v0.2.0 or later, then delete them (docs/setup.md, "Moving to eShop"). An entry whose name the release's manifests don't use changes nothing.
  images:
    - name: ghcr.io/pkhamdee/sphone-api
      newTag: 0.2.0 # {"$imagepolicy": "flux-system:eshop-release:tag"}
    - name: ghcr.io/pkhamdee/sphone-web
      newTag: 0.2.0 # {"$imagepolicy": "flux-system:eshop-release:tag"}
    - name: ghcr.io/pkhamdee/sphone-node-api
      newTag: 0.2.0 # {"$imagepolicy": "flux-system:eshop-release:tag"}
    - name: ghcr.io/pkhamdee/sphone-sync-master
      newTag: 0.2.0 # {"$imagepolicy": "flux-system:eshop-release:tag"}
    - name: docker.io/pkhamdee/eshop-api
      newTag: 0.2.0 # {"$imagepolicy": "flux-system:eshop-release:tag"}
    - name: docker.io/pkhamdee/eshop-web
      newTag: 0.2.0 # {"$imagepolicy": "flux-system:eshop-release:tag"}
    - name: docker.io/pkhamdee/eshop-node-api
      newTag: 0.2.0 # {"$imagepolicy": "flux-system:eshop-release:tag"}
    - name: docker.io/pkhamdee/eshop-sync-master
      newTag: 0.2.0 # {"$imagepolicy": "flux-system:eshop-release:tag"}
