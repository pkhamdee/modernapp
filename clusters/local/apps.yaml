# eshop-dev follows main (newest main-<sha> images, manifests from main).
# eshop-prod (Kustomization apps-prod) is pinned to one release in prod-release.yaml (docs/git-workflow.md).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-dev
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./deploy/apps/dev
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
