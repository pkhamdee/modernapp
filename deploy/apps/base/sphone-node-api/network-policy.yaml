# Arrows: Gateway (Traefik) -> sphone-node-api (public images); sphone-api (same namespace) ->
# sphone-node-api (internal API); sphone-node-api -> Samba (thirdparty).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sphone-node-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sphone-node-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sphone-api
      ports:
        - port: http
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: thirdparty
          podSelector:
            matchLabels:
              app.kubernetes.io/name: samba
      ports:
        - port: 445
