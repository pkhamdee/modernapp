apiVersion: apps/v1
kind: Deployment
metadata:
  name: sphone-web
  labels:
    app.kubernetes.io/name: sphone-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sphone-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sphone-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sphone-web
          # Tag set per environment by the overlay (Flux image automation).
          image: ghcr.io/pkhamdee/sphone-web
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The caddy binary carries the cap_net_bind_service file capability; without it
            # in the bounding set, exec fails with "operation not permitted".
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sphone-web
spec:
  selector:
    app.kubernetes.io/name: sphone-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sphone-web
spec:
  parentRefs:
    - name: sphone
      namespace: gateway
      sectionName: https
  hostnames:
    - sphone.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sphone-web
          port: 80
