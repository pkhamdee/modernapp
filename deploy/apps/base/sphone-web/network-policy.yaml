# Arrows: Gateway (Traefik) -> sphone-web. sphone-web calls nothing (static files only).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sphone-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sphone-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: http
  egress: []
