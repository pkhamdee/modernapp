# Arrows into the PostgreSQL instances (CloudNativePG): eshop-api and eshop-sync-master (same
# namespace) on 5432; the CNPG operator (cnpg-system) on 8000 (instance manager) and 5432;
# instances of the same cluster to each other (replication, if instances > 1).
# Out: the Kubernetes API server (TCP 443/6443, any address), and the same instances.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eshop-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: eshop-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: eshop-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: eshop-sync-master
      ports:
        - port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
        - podSelector:
            matchLabels:
              cnpg.io/cluster: eshop-db
      ports:
        - port: 8000
        - port: 5432
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: eshop-db
      ports:
        - port: 8000
        - port: 5432
    # Kubernetes API server (the instance manager watches its Cluster). Its address depends on the machine (the
    # `kubernetes` Service IP, and the node IP it is DNAT-ed to), so allow its ports on any address instead of
    # pinning IPs: 443 (the Service) and 6443 (k3s' API server on the node). Only these CNPG pods get this rule.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
