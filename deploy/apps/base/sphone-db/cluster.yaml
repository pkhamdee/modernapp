# Single-instance PostgreSQL (CloudNativePG) owned by sphone-api.
# The owner's credentials come from the overlay's SOPS-encrypted Secret `sphone-db-credentials`.
# Read-write service: sphone-db-rw:5432, database `sphone`.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sphone-db
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: sphone
      owner: sphone
      secret:
        name: sphone-db-credentials
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
