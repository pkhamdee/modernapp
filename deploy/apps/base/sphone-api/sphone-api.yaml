apiVersion: apps/v1
kind: Deployment
metadata:
  name: sphone-api
  labels:
    app.kubernetes.io/name: sphone-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sphone-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sphone-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sphone-api
          # Tag set per environment by the overlay (Flux image automation).
          image: ghcr.io/pkhamdee/sphone-api
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sphone-db-credentials
                  key: password
            - name: ConnectionStrings__Sphone
              value: Host=sphone-db-rw;Database=sphone;Username=sphone;Password=$(DB_PASSWORD);GSS Encryption Mode=Disable
            # Migrations and demo seed data are applied at startup (EF Core takes a lock, so this is safe).
            - name: Database__MigrateOnStartup
              value: "true"
            # Token signing key, per environment (deploy/apps/<env>/sphone-api-auth.sops.yaml).
            - name: Auth__SigningKey
              valueFrom:
                secretKeyRef:
                  name: sphone-api-auth
                  key: signing-key
            # SMS (and later ID Verification, Credit Check) go to the shared thirdparty-mock.
            - name: ThirdParty__BaseUrl
              value: http://thirdparty-mock.thirdparty.svc.cluster.local/
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sphone-api
spec:
  selector:
    app.kubernetes.io/name: sphone-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sphone-api
spec:
  parentRefs:
    - name: sphone
      namespace: gateway
      sectionName: https
  hostnames:
    - sphone.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: sphone-api
          port: 80
