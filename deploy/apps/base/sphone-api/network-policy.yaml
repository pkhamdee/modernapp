# Arrows: Gateway (Traefik) -> sphone-api -> its PostgreSQL, sphone-node-api (same namespace)
# and thirdparty-mock (thirdparty). The other ends allow these in their own policies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sphone-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sphone-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: http
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: sphone-db
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sphone-node-api
      ports:
        - port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: thirdparty
          podSelector:
            matchLabels:
              app.kubernetes.io/name: thirdparty-mock
      ports:
        - port: 8080
