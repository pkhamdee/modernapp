apiVersion: apps/v1
kind: Deployment
metadata:
  name: eshop-web
  labels:
    app.kubernetes.io/name: eshop-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eshop-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eshop-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eshop-web
          # Tag set per environment by the overlay (Flux image automation).
          image: docker.io/pkhamdee/eshop-web
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The image strips caddy's cap_net_bind_service file capability, so ALL can be dropped.
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eshop-web
spec:
  selector:
    app.kubernetes.io/name: eshop-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: eshop-web
spec:
  parentRefs:
    - name: eshop
      namespace: gateway
      sectionName: https
  hostnames:
    - eshop.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: eshop-web
          port: 80
