# Arrows: Gateway (Traefik) -> eshop-node-api (public images); eshop-api (same namespace) ->
# eshop-node-api (internal API); eshop-node-api -> Samba (thirdparty).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eshop-node-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: eshop-node-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: eshop-api
      ports:
        - port: http
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: thirdparty
          podSelector:
            matchLabels:
              app.kubernetes.io/name: samba
      ports:
        - port: 445
