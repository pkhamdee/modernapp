# sphone-prod: same apps as sphone-dev, its own database, served at https://prod.sphone.localhost.
# Image tags follow release tags (vX.Y.Z -> X.Y.Z images); see image-automation.yaml and docs/git-workflow.md.
# To add a service to prod: add ../base/<service> to resources, an ImageRepository + ImagePolicy in
# image-automation.yaml, and an `images:` entry below with the sphone-prod marker. HTTPRoutes are moved to the
# prod hostname by the patch below automatically.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sphone-prod
resources:
  - sphone-db-credentials.sops.yaml
  - sphone-api-auth.sops.yaml
  - ../base/sphone-db
  - ../base/sphone-api
  - ../base/sphone-web
  - image-automation.yaml
patches:
  # Every app route: prod hostname on the Gateway's prod listener (base routes use sphone.localhost / https).
  - target:
      kind: HTTPRoute
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: [prod.sphone.localhost]
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: https-prod
# Tags are written by Flux image automation (image-automation.yaml); do not edit by hand.
# Until the first release they point at a CI release dry run (0.0.0-test.N); the first real X.Y.Z replaces them.
images:
  - name: ghcr.io/pkhamdee/sphone-api
    newTag: 0.0.0-test.1 # {"$imagepolicy": "sphone-prod:sphone-api:tag"}
  - name: ghcr.io/pkhamdee/sphone-web
    newTag: 0.0.0-test.1 # {"$imagepolicy": "sphone-prod:sphone-web:tag"}
