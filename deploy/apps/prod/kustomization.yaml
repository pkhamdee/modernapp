# eshop-prod: same apps as eshop-dev, its own database, served at https://prod.eshop.localhost.
# Flux applies this folder as it is in the pinned release tag vX.Y.Z, with the X.Y.Z images (apps-prod in
# clusters/local/prod-release.yaml, docs/git-workflow.md); there are no image tags here.
# To add a service to prod: add ../base/<service> to resources and an `images:` entry to apps-prod in
# clusters/local/prod-release.yaml (its newTag line ending in `# release-pin: prod`). HTTPRoutes are moved to the
# prod hostname by the patch below automatically.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: eshop-prod
resources:
  - ../../network-policies/default-deny
  - eshop-db-credentials.sops.yaml
  - eshop-api-auth.sops.yaml
  - eshop-api-staff.sops.yaml
  - eshop-node-api-smb.sops.yaml
  - eshop-sync-master-enterprise.sops.yaml
  - ../base/eshop-db
  - ../base/eshop-api
  - ../base/eshop-web
  - ../base/eshop-node-api
  - ../base/eshop-sync-master
patches:
  # Every app route: prod hostname on the Gateway's prod listener (base routes use eshop.localhost / https).
  - target:
      kind: HTTPRoute
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: [prod.eshop.localhost]
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: https-prod
  # eshop-node-api: prod's own share on the shared Samba (thirdparty).
  - target:
      kind: Deployment
      name: eshop-node-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: eshop-node-api
      spec:
        template:
          spec:
            containers:
              - name: eshop-node-api
                env:
                  - name: SMB_SHARE
                    value: eshop-prod
  # eshop-sync-master: prod's own Enterprise database on the shared SQL Server (thirdparty).
  - target:
      kind: Deployment
      name: eshop-sync-master
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: eshop-sync-master
      spec:
        template:
          spec:
            containers:
              - name: eshop-sync-master
                env:
                  - name: ENTERPRISE_DATABASE
                    value: enterprise_prod
