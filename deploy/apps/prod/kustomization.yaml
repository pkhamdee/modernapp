# sphone-prod: same apps as sphone-dev, its own database, served at https://prod.sphone.localhost.
# Image tags follow release tags (vX.Y.Z -> X.Y.Z images); see image-automation.yaml and docs/git-workflow.md.
# To add a service to prod: add ../base/<service> to resources, an ImageRepository + ImagePolicy in
# image-automation.yaml, and an `images:` entry below with the sphone-prod marker. HTTPRoutes are moved to the
# prod hostname by the patch below automatically.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sphone-prod
resources:
  - ../../network-policies/default-deny
  - sphone-db-credentials.sops.yaml
  - sphone-api-auth.sops.yaml
  - sphone-api-staff.sops.yaml
  - sphone-node-api-smb.sops.yaml
  - sphone-sync-master-enterprise.sops.yaml
  - ../base/sphone-db
  - ../base/sphone-api
  - ../base/sphone-web
  - ../base/sphone-node-api
  - ../base/sphone-sync-master
  - image-automation.yaml
patches:
  # Every app route: prod hostname on the Gateway's prod listener (base routes use sphone.localhost / https).
  - target:
      kind: HTTPRoute
    patch: |-
      - op: replace
        path: /spec/hostnames
        value: [prod.sphone.localhost]
      - op: replace
        path: /spec/parentRefs/0/sectionName
        value: https-prod
  # sphone-node-api: prod's own share on the shared Samba (thirdparty).
  - target:
      kind: Deployment
      name: sphone-node-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sphone-node-api
      spec:
        template:
          spec:
            containers:
              - name: sphone-node-api
                env:
                  - name: SMB_SHARE
                    value: sphone-prod
  # sphone-sync-master: prod's own Enterprise database on the shared SQL Server (thirdparty).
  - target:
      kind: Deployment
      name: sphone-sync-master
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sphone-sync-master
      spec:
        template:
          spec:
            containers:
              - name: sphone-sync-master
                env:
                  - name: ENTERPRISE_DATABASE
                    value: enterprise_prod
# Tags are written by Flux image automation (image-automation.yaml); do not edit by hand.
# Until the first release they point at a CI release dry run (0.0.0-test.N); the first real X.Y.Z replaces them.
images:
  - name: ghcr.io/pkhamdee/sphone-api
    newTag: 0.0.0-test.2 # {"$imagepolicy": "sphone-prod:sphone-api:tag"}
  - name: ghcr.io/pkhamdee/sphone-web
    newTag: 0.0.0-test.2 # {"$imagepolicy": "sphone-prod:sphone-web:tag"}
  - name: ghcr.io/pkhamdee/sphone-node-api
    newTag: 0.0.0-test.2 # {"$imagepolicy": "sphone-prod:sphone-node-api:tag"}
  - name: ghcr.io/pkhamdee/sphone-sync-master
    newTag: 0.0.0-test.0 # {"$imagepolicy": "sphone-prod:sphone-sync-master:tag"}
