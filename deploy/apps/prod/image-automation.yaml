# sphone-prod follows release tags: a vX.Y.Z tag on release/N.x makes CI push ghcr.io/pkhamdee/<service>:X.Y.Z;
# each ImagePolicy picks the newest semver tag (never main-<sha>), and the ImageUpdateAutomation rewrites the
# setter markers in kustomization.yaml and commits to main.
# The policies also accept the CI release dry run's 0.0.0-test.N tags (workflow_dispatch input `version`): every
# real X.Y.Z outranks them, so they only run in prod before the first release. They exist because an ImagePolicy
# with no matching tag stays Reconciling forever, which would keep apps-prod unhealthy until the first release. To add a service: one ImageRepository + ImagePolicy below, and one `images:` entry with a
# `# {"$imagepolicy": "sphone-prod:<service>:tag"}` marker in kustomization.yaml.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: sphone-api
spec:
  image: ghcr.io/pkhamdee/sphone-api
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sphone-api
spec:
  imageRepositoryRef:
    name: sphone-api
  filterTags:
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-test\.[0-9]+)?$'
  policy:
    semver:
      range: '>=0.0.0-0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: sphone-web
spec:
  image: ghcr.io/pkhamdee/sphone-web
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sphone-web
spec:
  imageRepositoryRef:
    name: sphone-web
  filterTags:
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-test\.[0-9]+)?$'
  policy:
    semver:
      range: '>=0.0.0-0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: sphone-node-api
spec:
  image: ghcr.io/pkhamdee/sphone-node-api
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sphone-node-api
spec:
  imageRepositoryRef:
    name: sphone-node-api
  filterTags:
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-test\.[0-9]+)?$'
  policy:
    semver:
      range: '>=0.0.0-0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: sphone-prod
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        sphone-prod: update images [skip ci]

        {{ range .Changed.Changes -}}
        - {{ .OldValue }} -> {{ .NewValue }}
        {{ end -}}
    push:
      branch: main
  update:
    path: ./deploy/apps/prod
    strategy: Setters
