# eshop-dev follows main: CI pushes docker.io/pkhamdee/<service>:main-<sha>-<unix-ts>; each ImagePolicy picks the
# newest by timestamp, and the ImageUpdateAutomation rewrites the setter markers in kustomization.yaml and
# commits to main. To add a service: one ImageRepository + ImagePolicy below, and one `images:` entry with a
# `# {"$imagepolicy": "eshop-dev:<service>:tag"}` marker in kustomization.yaml.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: eshop-api
spec:
  image: docker.io/pkhamdee/eshop-api
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: eshop-api
spec:
  imageRepositoryRef:
    name: eshop-api
  filterTags:
    pattern: '^main-[a-f0-9]+-(?P<ts>[0-9]+)$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: eshop-web
spec:
  image: docker.io/pkhamdee/eshop-web
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: eshop-web
spec:
  imageRepositoryRef:
    name: eshop-web
  filterTags:
    pattern: '^main-[a-f0-9]+-(?P<ts>[0-9]+)$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: eshop-node-api
spec:
  image: docker.io/pkhamdee/eshop-node-api
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: eshop-node-api
spec:
  imageRepositoryRef:
    name: eshop-node-api
  filterTags:
    pattern: '^main-[a-f0-9]+-(?P<ts>[0-9]+)$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: eshop-sync-master
spec:
  image: docker.io/pkhamdee/eshop-sync-master
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: eshop-sync-master
spec:
  imageRepositoryRef:
    name: eshop-sync-master
  filterTags:
    pattern: '^main-[a-f0-9]+-(?P<ts>[0-9]+)$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: eshop-dev
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        eshop-dev: update images

        {{ range .Changed.Changes -}}
        - {{ .OldValue }} -> {{ .NewValue }}
        {{ end -}}
    push:
      branch: main
  update:
    path: ./deploy/apps/dev
    strategy: Setters
