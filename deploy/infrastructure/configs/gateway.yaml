# The single entry point (ADR-0002), one hostname per environment on the same Gateway and port 443:
#   https://eshop.localhost       -> eshop-dev   (listener `https`; any namespace labelled eshop.io/gateway-access: "true")
#   https://prod.eshop.localhost  -> eshop-prod  (listener `https-prod`; only the eshop-prod namespace)
# Apps attach HTTPRoutes with parentRefs {name: eshop, namespace: gateway, sectionName: https}; the prod overlay
# rewrites sectionName to https-prod and the hostname to prod.eshop.localhost.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: eshop-localhost
  namespace: gateway
spec:
  secretName: eshop-localhost-tls
  dnsNames:
    - eshop.localhost
    - prod.eshop.localhost
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: eshop-local-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eshop
  namespace: gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: eshop.localhost
      tls:
        mode: Terminate
        certificateRefs:
          - name: eshop-localhost-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              eshop.io/gateway-access: "true"
    - name: https-prod
      protocol: HTTPS
      port: 443
      hostname: prod.eshop.localhost
      tls:
        mode: Terminate
        certificateRefs:
          - name: eshop-localhost-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: eshop-prod
    - name: http
      protocol: HTTP
      port: 80
      hostname: eshop.localhost
      allowedRoutes:
        namespaces:
          from: Same
    - name: http-prod
      protocol: HTTP
      port: 80
      hostname: prod.eshop.localhost
      allowedRoutes:
        namespaces:
          from: Same
---
# Plain HTTP only ever redirects to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: eshop
      sectionName: http
    - name: eshop
      sectionName: http-prod
  hostnames:
    - eshop.localhost
    - prod.eshop.localhost
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
