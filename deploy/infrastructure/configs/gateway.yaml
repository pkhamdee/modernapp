# The single entry point https://sphone.localhost (ADR-0002).
# Apps attach HTTPRoutes with parentRefs {name: sphone, namespace: gateway, sectionName: https}
# from any namespace labelled sphone.io/gateway-access: "true".
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sphone-localhost
  namespace: gateway
spec:
  secretName: sphone-localhost-tls
  dnsNames:
    - sphone.localhost
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: sphone-local-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sphone
  namespace: gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: sphone.localhost
      tls:
        mode: Terminate
        certificateRefs:
          - name: sphone-localhost-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              sphone.io/gateway-access: "true"
    - name: http
      protocol: HTTP
      port: 80
      hostname: sphone.localhost
      allowedRoutes:
        namespaces:
          from: Same
---
# Plain HTTP only ever redirects to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: sphone
      sectionName: http
  hostnames:
    - sphone.localhost
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
