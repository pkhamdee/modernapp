# The cluster's GitHub Actions runner for the smoke test (Flux Kustomization infra-runners, ADR 0008).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - eshop-e2e.yaml
  - runner-rbac.yaml
  # The scale set's GitHub token, a SOPS file a maintainer creates (docs/setup.md, "Cluster runner"). A listed file
  # that does not exist breaks the whole Kustomization, so this line is uncommented in the same commit that adds it:
  # - eshop-e2e-github.sops.yaml
