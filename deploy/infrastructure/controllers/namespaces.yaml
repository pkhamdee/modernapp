# Namespaces labelled eshop.io/gateway-access may attach HTTPRoutes to the eshop Gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: eshop-dev
  labels:
    eshop.io/gateway-access: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: eshop-prod
  labels:
    eshop.io/gateway-access: "true"
---
# Temporary: prod's namespace in releases up to v0.1.x, where prod keeps running until v0.2.0 is out (#50).
# Delete it once prod runs v0.2.0 or later (docs/setup.md, "Moving to eShop"); Flux then prunes it.
apiVersion: v1
kind: Namespace
metadata:
  name: sphone-prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: thirdparty
  labels:
    eshop.io/gateway-access: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
