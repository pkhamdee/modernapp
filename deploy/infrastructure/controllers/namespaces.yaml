kind: Namespace
metadata:
  name: sphone-dev
  labels:
    sphone.io/gateway-access: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: sphone-prod
  labels:
    sphone.io/gateway-access: "true"
---
apiVersion: v1
kind: Namespace
