# Arrows: Gateway (Traefik) -> thirdparty-mock (developer pages: home, SMS inbox, Enterprise admin);
# eshop-api (eshop-dev, eshop-prod) -> thirdparty-mock; thirdparty-mock -> SQL Server (admin tool).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thirdparty-mock
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: thirdparty-mock
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [eshop-dev, eshop-prod, sphone-prod]
          # sphone-prod and sphone-api: prod's namespace and this caller's name in releases up to v0.1.x,
          # which prod runs until v0.2.0 (#49, #50). Drop both once prod runs v0.2.0 or later (docs/setup.md).
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [eshop-api, sphone-api]
      ports:
        - port: http
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mssql
      ports:
        - port: 1433
