# Arrows: Gateway (Traefik) -> thirdparty-mock (developer pages: home, SMS inbox, Enterprise admin);
# eshop-api (eshop-dev, eshop-qa, eshop-prod) -> thirdparty-mock; thirdparty-mock -> SQL Server (admin tool).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thirdparty-mock
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: thirdparty-mock
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [eshop-dev, eshop-qa, eshop-prod]
          podSelector:
            matchLabels:
              app.kubernetes.io/name: eshop-api
      ports:
        - port: http
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mssql
      ports:
        - port: 1433
