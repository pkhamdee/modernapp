# thirdparty-mock: one Node service pretending to be SMS (later also ID Verification and Credit Check).
# In-cluster:  http://thirdparty-mock.thirdparty.svc.cluster.local/   (sphone-api's ThirdParty__BaseUrl)
# Browser:     https://sphone.localhost/thirdparty-mock/  (home + delay), .../thirdparty-mock/sms/inbox (mock SMS inbox),
#              .../thirdparty-mock/enterprise/ (mock Enterprise System admin tool: Contracts, simulate Payment, cancel)
# State (messages, delay) is in memory: a restart clears it. Keep one replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thirdparty-mock
  labels:
    app.kubernetes.io/name: thirdparty-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thirdparty-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thirdparty-mock
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: thirdparty-mock
          # Tag set by Flux image automation (deploy/thirdparty/kustomization.yaml).
          image: ghcr.io/pkhamdee/thirdparty-mock
          env:
            # Mock Enterprise System admin tool (/enterprise/): SQL Server login enterprise_admin.
            - name: ENTERPRISE_SQL_SERVER
              value: mssql
            - name: ENTERPRISE_SQL_USER
              value: enterprise_admin
            - name: ENTERPRISE_SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-credentials
                  key: admin-password
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 160Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: thirdparty-mock
spec:
  selector:
    app.kubernetes.io/name: thirdparty-mock
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Dev convenience: the mock's pages under https://sphone.localhost/thirdparty-mock/ (prefix stripped).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thirdparty-mock
spec:
  parentRefs:
    - name: sphone
      namespace: gateway
      sectionName: https
  hostnames:
    - sphone.localhost
  rules:
    # The pages use relative links, so the prefix must end in "/".
    - matches:
        - path:
            type: Exact
            value: /thirdparty-mock
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /thirdparty-mock/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /thirdparty-mock/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: thirdparty-mock
          port: 80
