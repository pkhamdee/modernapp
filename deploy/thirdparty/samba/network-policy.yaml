# Arrows: eshop-node-api (eshop-dev, eshop-qa, eshop-prod) -> Samba. Samba calls nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: samba
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: samba
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [eshop-dev, eshop-qa, eshop-prod]
          podSelector:
            matchLabels:
              app.kubernetes.io/name: eshop-node-api
      ports:
        - port: 445
  egress: []
