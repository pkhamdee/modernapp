# Mock Windows file share for images: one Samba server, one share per environment (eshop-dev, eshop-prod),
# each with a `public` and a `private` area (folders eshop-node-api creates). Each environment has its own
# SMB account that can open only its own share; passwords live in samba-accounts.sops.yaml and must match
# the eshop-node-api-smb secret of that environment.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: samba-shares
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  labels:
    app.kubernetes.io/name: samba
spec:
  replicas: 1
  strategy:
    type: Recreate # ReadWriteOnce volume
  selector:
    matchLabels:
      app.kubernetes.io/name: samba
  template:
    metadata:
      labels:
        app.kubernetes.io/name: samba
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Each environment's share folder belongs to its SMB account (UIDs match UID_* below).
        - name: share-folders
          image: ghcr.io/servercontainers/samba:smbd-only-a3.24.3-s4.23.8-r0
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /shares/eshop-dev /shares/eshop-prod
              chown 1003:1003 /shares/eshop-dev && chmod 0700 /shares/eshop-dev
              chown 1004:1004 /shares/eshop-prod && chmod 0700 /shares/eshop-prod
          volumeMounts:
            - name: shares
              mountPath: /shares
      containers:
        # smbd runs as root and switches to the SMB account per connection (the image's entrypoint creates
        # the accounts from ACCOUNT_* at start).
        - name: samba
          image: ghcr.io/servercontainers/samba:smbd-only-a3.24.3-s4.23.8-r0
          env:
            - name: AVAHI_DISABLE
              value: "1"
            - name: WSDD2_DISABLE
              value: "1"
            - name: NETBIOS_DISABLE
              value: "1"
            - name: SAMBA_GLOBAL_CONFIG_server_SPACE_min_SPACE_protocol
              value: SMB2_10
            - name: ACCOUNT_eshopdev
              valueFrom:
                secretKeyRef:
                  name: samba-accounts
                  key: eshopdev
            - name: UID_eshopdev
              value: "1003"
            - name: ACCOUNT_eshopprod
              valueFrom:
                secretKeyRef:
                  name: samba-accounts
                  key: eshopprod
            - name: UID_eshopprod
              value: "1004"
            - name: SAMBA_VOLUME_CONFIG_eshopdev
              value: "[eshop-dev]; path = /shares/eshop-dev; valid users = eshopdev; guest ok = no; read only = no; browseable = yes; create mask = 0600; directory mask = 0700"
            - name: SAMBA_VOLUME_CONFIG_eshopprod
              value: "[eshop-prod]; path = /shares/eshop-prod; valid users = eshopprod; guest ok = no; read only = no; browseable = yes; create mask = 0600; directory mask = 0700"
          ports:
            - name: smb
              containerPort: 445
          readinessProbe:
            tcpSocket:
              port: smb
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: smb
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: shares
              mountPath: /shares
      volumes:
        - name: shares
          persistentVolumeClaim:
            claimName: samba-shares
---
apiVersion: v1
kind: Service
metadata:
  name: samba
spec:
  selector:
    app.kubernetes.io/name: samba
  ports:
    - name: smb
      port: 445
      targetPort: smb
